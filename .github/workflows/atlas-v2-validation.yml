name: Validate Academy Shared 2D Engine

on:
  pull_request:
    branches: [main]
    paths:
      - "src/features/atlas/engine/**"
      - "src/features/atlas/shared/**"
      - "src/features/atlas/ACADEMY-SHARED-ENGINE-ARCHITECTURE.md"
      - "src/features/atlas/adapters/**"
      - "src/features/atlas/atlas-v2-view.js"
      - "src/main.js"
      - "src/styles.css"
      - "tests/atlas-browser-smoke.mjs"
      - "tests/atlas-pixi.test.js"
      - "src/catalogue-*.js"
      - "scripts/build.mjs"
      - "tests/atlas-engine/**"
      - "package.json"
      - ".github/workflows/atlas-v2-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run complete test suite
        run: npm test
      - name: Benchmark shared biological geometry
        run: npm run benchmark:atlas
      - name: Verify source syntax and public bundle
        run: npm run build
      - name: Install browser smoke dependencies
        run: npm install --no-save esbuild pixi.js playwright
      - name: Install Chromium for real WebGL smoke test
        run: npx playwright install --with-deps chromium
      - name: Serve production Academy for browser verification
        run: |
          python3 -m http.server 4173 --directory . > /tmp/academy-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/academy-http.log
          exit 1
      - name: Verify shared biological Atlas on desktop and mobile
        run: node tests/atlas-browser-smoke.mjs
      - name: Upload shared Atlas browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academy-shared-atlas-browser-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
